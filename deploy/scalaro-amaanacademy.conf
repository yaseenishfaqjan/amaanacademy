# ============================================================================
# Amaan Academy — server block to ADD into the shared Scalaro nginx config
# File on VPS: /opt/scalaro/nginx.conf
# Container:   amaanacademy-app (port 80, on scalaro-net)
# Get the SSL cert FIRST (certbot) before enabling the 443 blocks.
# ============================================================================

# HTTP -> HTTPS (and www -> apex)
server {
    listen 80;
    server_name amaanacademy.com www.amaanacademy.com;

    # Let's Encrypt HTTP-01 challenge (webroot method)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://amaanacademy.com$request_uri;
    }
}

# HTTPS: www -> apex redirect
server {
    listen 443 ssl http2;
    server_name www.amaanacademy.com;
    ssl_certificate     /etc/letsencrypt/live/amaanacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amaanacademy.com/privkey.pem;
    return 301 https://amaanacademy.com$request_uri;
}

# HTTPS: main site -> reverse proxy to the static container
server {
    listen 443 ssl http2;
    server_name amaanacademy.com;

    ssl_certificate     /etc/letsencrypt/live/amaanacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amaanacademy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://amaanacademy-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
