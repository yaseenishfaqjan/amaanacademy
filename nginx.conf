# Container-internal nginx: serves the static Amaan Academy site on port 80.
# Domain routing, HTTPS and www->apex are handled by the shared Scalaro nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve /path/ -> /path/index.html; real 404 for anything missing (fixes soft-404)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Long cache for static assets, no-cache for HTML so updates show immediately
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
